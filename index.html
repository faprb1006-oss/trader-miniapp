<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>معامله‌گر</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font-family:Tahoma,Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px}.header{display:flex;justify-content:space-between;margin-bottom:18px}
.title{font-size:25px;font-weight:700}.sub,.muted{font-size:12px;color:#9aa4b2}.card{background:#141b2d;border:1px solid #26304a;border-radius:18px;padding:16px;margin-bottom:14px}
.balance{font-size:28px;font-weight:700;margin-top:7px}.pair{display:flex;justify-content:space-between;align-items:center}.pair-name{font-size:18px;font-weight:700}
.price{font-size:27px;font-weight:700;margin-top:14px}.change{margin-top:6px;font-size:14px}.positive{color:#35d07f}.negative{color:#ff647c}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;padding:12px;border:0;border-radius:12px;background:#202a40;color:#cbd3df;font-size:15px}
.tab.active{background:#35d07f;color:#07120c;font-weight:700}.input{width:100%;padding:14px;border-radius:12px;border:1px solid #34405d;background:#0f1627;color:#fff;font-size:18px}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#35d07f;color:#07120c;font-size:16px;font-weight:700}
.btn.sell{background:#ff647c;color:#21050b}.status{text-align:center;font-size:12px;color:#9aa4b2;margin-top:10px}.trade{padding:11px 0;border-bottom:1px solid #273149;font-size:13px}.trade:last-child{border:0}
.row{display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div><div class="title">معامله‌گر</div><div class="sub">مینی اپ معاملاتی</div></div><div class="sub" id="userName">مهمان</div></div>

<div class="card"><div class="sub">موجودی آزمایشی</div><div class="balance" id="balance">$10,000.00</div></div>

<div class="card">
<div class="pair"><div><div class="pair-name">BTC / USDT</div><div class="sub">قیمت لحظه‌ای</div></div><div class="sub" id="updated">در حال دریافت...</div></div>
<div class="price" id="btcPrice">در حال دریافت...</div><div class="change" id="btcChange">—</div>
</div>

<div class="card">
<div class="tabs"><button class="tab active" id="buyTab" onclick="setSide('buy')">خرید</button><button class="tab" id="sellTab" onclick="setSide('sell')">فروش</button></div>
<input id="amount" class="input" type="number" min="1" step=".01" value="100" placeholder="مبلغ USDT">
<button id="orderBtn" class="btn" onclick="placeOrder()">ثبت سفارش خرید</button>
<div class="status" id="status">سفارش‌ها فقط آزمایشی هستند.</div>
</div>

<div class="card"><div class="pair"><div class="pair-name">تاریخچه معاملات</div><div class="sub">آزمایشی</div></div>
<div id="history" style="margin-top:10px"><div class="muted">هنوز معامله‌ای ثبت نشده است.</div></div></div>
</div>

<script>
let side='buy',balance=10000,currentPrice=0;
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();const u=tg.initDataUnsafe?.user;if(u)document.getElementById('userName').textContent=u.first_name||u.username||'کاربر';}
function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function setSide(s){side=s;document.getElementById('buyTab').classList.toggle('active',s==='buy');document.getElementById('sellTab').classList.toggle('active',s==='sell');const b=document.getElementById('orderBtn');b.textContent=s==='buy'?'ثبت سفارش خرید':'ثبت سفارش فروش';b.className=s==='buy'?'btn':'btn sell';}
async function loadPrice(){
 try{
  const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true',{cache:'no-store'});
  if(!r.ok)throw Error();
  const d=await r.json();currentPrice=d.bitcoin.usd;const c=d.bitcoin.usd_24h_change;
  document.getElementById('btcPrice').textContent='$'+money(currentPrice);
  const ce=document.getElementById('btcChange');ce.textContent=(c>=0?'+':'')+c.toFixed(2)+'% در ۲۴ ساعت';ce.className='change '+(c>=0?'positive':'negative');
  document.getElementById('updated').textContent='بروزرسانی: '+new Date().toLocaleTimeString('fa-IR');
 }catch(e){document.getElementById('btcPrice').textContent='خطا در دریافت قیمت';document.getElementById('btcChange').textContent='دوباره تلاش می‌شود';document.getElementById('btcChange').className='change negative';}
}
function placeOrder(){
 const amount=Number(document.getElementById('amount').value);if(!amount||amount<=0){document.getElementById('status').textContent='مبلغ را وارد کن.';return;}
 if(side==='buy'&&amount>balance){document.getElementById('status').textContent='موجودی آزمایشی کافی نیست.';return;}
 balance+=side==='buy'?-amount:amount;document.getElementById('balance').textContent='$'+money(balance);
 const h=document.getElementById('history');if(h.querySelector('.muted'))h.innerHTML='';
 const x=document.createElement('div');x.className='trade';x.innerHTML='<div class="row"><strong>'+(side==='buy'?'خرید BTC':'فروش BTC')+'</strong><span>'+(side==='buy'?'-':'+')+'$'+money(amount)+'</span></div><div class="sub">قیمت: '+(currentPrice?'$'+money(currentPrice):'نامشخص')+' · '+new Date().toLocaleTimeString('fa-IR')+'</div>';h.prepend(x);
 document.getElementById('status').textContent='سفارش آزمایشی با موفقیت ثبت شد.';
}
loadPrice();setInterval(loadPrice,60000);
</script>
</body>
</html>
